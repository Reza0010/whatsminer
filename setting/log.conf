* GLOBAL:
    ENABLED                 =   true
    TO_FILE                 =   true
    TO_STANDARD_OUTPUT      =   true
    FORMAT                  =   "[%process | %datetime] %msg"
    FILENAME                =   "log\\log_%datetime{%Y%M%d}_global.log"
    MILLISECONDS_WIDTH      =   3
    PERFORMANCE_TRACKING    =   false
    MAX_LOG_FILE_SIZE       =   104857600
    LOG_FLUSH_THRESHOLD     =   0
* ERROR:
    FILENAME                =   "log\\log_%datetime{%Y%M%d}_error.log"
* DEBUG:
    FILENAME                =   "log\\log_%datetime{%Y%M%d}_debug.log"
* INFO:
    FILENAME                =   "log\\log_%datetime{%Y%M%d}_info.log"
